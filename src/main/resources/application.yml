project:
  name: Hotspot Admin Domain API
  version: 1.0.0
  admin-code: ${ADMIN_CODE}
  encryption-provider: ${ENCRYPTION_PROVIDER:local}
  kms-key-id: ${KEK_KEY_ID:}
  phone-secret-key: ${PHONE_SECRET_KEY}
  phone-hash-key: ${PHONE_HASH_KEY}

jwt:
  secret: ${JWT_SECRET_KEY}
  expiration: 86400000 # 1 day in milliseconds

server:
  port: 8081
  forward-headers-strategy: framework

  # 프론트 주소
  domain:
    local: ${ADMIN_LOCAL_SERVER_URL}
    dev: ${ADMIN_DEV_SERVER_URL}

spring:
  application:
    name: hotspot-admin

  profiles:
    default: local

  config:
    import:
      - classpath:postgres.yml
      - classpath:redis.yml

  web:
    resources:
      add-mappings: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

---
spring:
  config:
    activate:
      on-profile: local

logging:
  level:
    root: INFO

---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    root: INFO
